[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetpulse"
version = "0.1.0"
description = "Real-time tweet analytics pipeline with Azure Blob Storage, Snowpipe, Snowflake, and Streamlit."
requires-python = ">=3.11"
dependencies = [
    "azure-identity==1.17.1",
    "azure-functions==1.21.3",
    "azure-storage-blob==12.22.0",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "python-dotenv==1.0.1",
    "snowflake-connector-python==3.12.2",
    "streamlit==1.39.0",
    "streamlit-autorefresh==1.0.1",
    "websockets==13.1",
]

[tool.setuptools.packages.find]
where = ["src"]
