<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated neon data background</title>
  <desc id="desc">A moving neon background with floating particles and data grid effects.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.35" stop-color="#0F172A"/>
      <stop offset="0.7" stop-color="#312E81"/>
      <stop offset="1" stop-color="#701A75"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 500 130" to="360 500 130" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="30" fill="url(#aurora)"/>
  <rect width="1000" height="260" rx="30" fill="url(#grid)">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#blur)" opacity="0.7">
    <circle cx="180" cy="80" r="56" fill="#38BDF8">
      <animate attributeName="cx" values="140;240;140" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="80" r="68" fill="#A855F7">
      <animate attributeName="cx" values="710;830;710" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="65;140;65" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="220" r="62" fill="#EC4899">
      <animate attributeName="cx" values="430;580;430" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#glow)">
    <path d="M80 188 C220 88 300 230 430 130 S680 34 900 150" stroke="#E0F2FE" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#38BDF8">
      <animateMotion dur="5s" repeatCount="indefinite" path="M80 188 C220 88 300 230 430 130 S680 34 900 150"/>
    </circle>
    <circle r="5" fill="#F0ABFC">
      <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M80 188 C220 88 300 230 430 130 S680 34 900 150"/>
    </circle>
    <circle r="4" fill="#F472B6">
      <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M80 188 C220 88 300 230 430 130 S680 34 900 150"/>
    </circle>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="90" fill="#FFFFFF" font-size="34" font-weight="900" letter-spacing="1">DATA ENGINEERING × ANALYTICS × AI</text>
    <text x="500" y="126" fill="#BAE6FD" font-size="17" font-weight="600">pipelines • cloud platforms • dashboards • MLOps • agentic workflows</text>
    <text x="500" y="218" fill="#FCE7F3" font-size="15" font-weight="700">
      building systems that move, learn, and create impact
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
