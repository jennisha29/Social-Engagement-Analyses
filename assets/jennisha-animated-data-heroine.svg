<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jennisha Martin animated data superhero character</title>
  <desc id="desc">Animated 3D-inspired female data superhero standing above a futuristic Git City with glowing Python energy, flowing cape, moving data streams, and floating technology icons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#581C87"/>
    </linearGradient>
    <radialGradient id="energy" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(740 145) rotate(90) scale(135)">
      <stop stop-color="#FEF3C7"/>
      <stop offset="0.36" stop-color="#F97316" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cape" x1="500" y1="242" x2="252" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="suit" x1="548" y1="216" x2="646" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hair" x1="530" y1="94" x2="630" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#3F1D09"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#38BDF8" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="38" fill="url(#sky)"/>
  <rect width="1200" height="560" rx="38" fill="url(#grid)">
    <animate attributeName="opacity" values="0.22;0.55;0.22" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="740" cy="145" r="160" fill="url(#energy)">
    <animate attributeName="r" values="138;172;138" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.75" filter="url(#glow)">
    <circle cx="82" cy="84" r="2" fill="#E0F2FE"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="198" cy="44" r="2.2" fill="#F5D0FE"><animate attributeName="opacity" values="1;0.15;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="92" r="2" fill="#BAE6FD"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="932" cy="74" r="2.2" fill="#FBCFE8"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1092" cy="112" r="2.5" fill="#DDD6FE"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0.78">
    <rect x="34" y="360" width="82" height="136" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.42"/>
    <rect x="142" y="300" width="92" height="196" rx="8" fill="#111827" stroke="#A78BFA" stroke-opacity="0.38"/>
    <rect x="264" y="268" width="104" height="228" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.42"/>
    <rect x="860" y="280" width="102" height="216" rx="8" fill="#111827" stroke="#F472B6" stroke-opacity="0.38"/>
    <rect x="992" y="318" width="84" height="178" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.42"/>
    <rect x="1090" y="250" width="84" height="246" rx="8" fill="#111827" stroke="#A78BFA" stroke-opacity="0.4"/>
    <path d="M60 388H96M154 338H220M292 312H338M880 326H940M1010 352H1054M1108 292H1158" stroke="#22C55E" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="0.78" filter="url(#glow)">
    <path d="M62 388 C202 292 306 428 456 342 S628 258 760 344 S980 430 1138 320" stroke-dasharray="12 22">
      <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#38BDF8"><animateMotion dur="4.8s" repeatCount="indefinite" path="M62 388 C202 292 306 428 456 342 S628 258 760 344 S980 430 1138 320"/></circle>
    <circle r="5" fill="#F472B6"><animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" path="M62 388 C202 292 306 428 456 342 S628 258 760 344 S980 430 1138 320"/></circle>
    <circle r="5" fill="#A78BFA"><animateMotion dur="4.8s" begin="3.2s" repeatCount="indefinite" path="M62 388 C202 292 306 428 456 342 S628 258 760 344 S980 430 1138 320"/></circle>
  </g>

  <g filter="url(#softShadow)">
    <path d="M520 242 C420 300 336 414 246 538 C408 492 496 462 590 466 C594 354 568 284 520 242Z" fill="url(#cape)" opacity="0.96">
      <animate attributeName="d" values="M520 242 C420 300 336 414 246 538 C408 492 496 462 590 466 C594 354 568 284 520 242Z;M520 242 C394 314 352 396 226 528 C400 506 512 442 590 466 C592 356 566 286 520 242Z;M520 242 C420 300 336 414 246 538 C408 492 496 462 590 466 C594 354 568 284 520 242Z" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <path d="M520 176 C510 116 546 82 592 84 C646 86 676 128 662 190 C652 240 536 238 520 176Z" fill="url(#hair)"/>
    <path d="M530 150 C514 174 514 220 532 250 C564 226 622 226 652 250 C674 214 670 168 650 142 C628 118 556 116 530 150Z" fill="url(#hair)">
      <animate attributeName="d" values="M530 150 C514 174 514 220 532 250 C564 226 622 226 652 250 C674 214 670 168 650 142 C628 118 556 116 530 150Z;M530 150 C502 184 524 224 534 250 C564 226 622 226 652 250 C684 212 664 166 650 142 C628 118 556 116 530 150Z;M530 150 C514 174 514 220 532 250 C564 226 622 226 652 250 C674 214 670 168 650 142 C628 118 556 116 530 150Z" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <ellipse cx="592" cy="280" rx="62" ry="92" fill="url(#suit)" stroke="#38BDF8" stroke-width="3"/>
    <path d="M552 290 L592 218 L636 290 L610 470 H572 Z" fill="#020617" opacity="0.45"/>
    <path d="M560 304 H626 M566 338 H620 M574 372 H612" stroke="#67E8F9" stroke-width="2" opacity="0.75" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M554 472 H630 L660 535 H524 Z" fill="#020617"/>

    <circle cx="592" cy="158" r="48" fill="#A16207" stroke="#FDE68A" stroke-width="3"/>
    <path d="M552 138 C562 106 628 104 642 138 C622 124 574 124 552 138Z" fill="url(#hair)"/>
    <circle cx="576" cy="158" r="4" fill="#020617"/>
    <circle cx="608" cy="158" r="4" fill="#020617"/>
    <path d="M578 180 C588 188 602 188 612 180" stroke="#451A03" stroke-width="3" stroke-linecap="round"/>

    <path d="M642 254 C682 208 704 172 735 146" stroke="#1E40AF" stroke-width="18" stroke-linecap="round"/>
    <path d="M536 258 C488 292 456 316 418 344" stroke="#1E40AF" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g filter="url(#glow)" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <circle cx="740" cy="145" r="54" fill="#111827" stroke="#FDE68A" stroke-width="3"/>
    <text x="740" y="156" font-size="46">🐍</text>
    <path d="M680 122 C706 80 774 80 800 122" stroke="#F97316" stroke-width="5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M696 190 C720 218 762 218 786 190" stroke="#F97316" stroke-width="5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" filter="url(#glow)">
    <text x="600" y="64" fill="#FFFFFF" font-size="43" font-weight="900" letter-spacing="1">JENNISHA MARTIN</text>
    <text x="600" y="100" fill="#BAE6FD" font-size="18" font-weight="800">Animated Data Heroine • Pipelines • Analytics • AI</text>
    <text x="600" y="512" fill="#F8FAFC" font-size="20" font-weight="900">Turning raw data into reliable systems, smarter decisions, and AI-powered impact.</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" filter="url(#glow)">
    <g transform="translate(402 148)">
      <text y="0" font-size="28">⚛️</text><text y="30" fill="#A5F3FC" font-size="12" font-weight="800">React</text>
      <animateTransform attributeName="transform" type="translate" values="402 148;402 118;402 148" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(332 228)">
      <text y="0" font-size="28">☁️</text><text y="30" fill="#FDBA74" font-size="12" font-weight="800">AWS</text>
      <animateTransform attributeName="transform" type="translate" values="332 228;332 198;332 228" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(842 226)">
      <text y="0" font-size="28">🐳</text><text y="30" fill="#BFDBFE" font-size="12" font-weight="800">Docker</text>
      <animateTransform attributeName="transform" type="translate" values="842 226;842 196;842 226" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(902 142)">
      <text y="0" font-size="28">❄️</text><text y="30" fill="#E0F2FE" font-size="12" font-weight="800">Snowflake</text>
      <animateTransform attributeName="transform" type="translate" values="902 142;902 116;902 142" dur="4.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(474 406)">
      <text y="0" font-size="28">🌀</text><text y="30" fill="#BBF7D0" font-size="12" font-weight="800">Airflow</text>
      <animateTransform attributeName="transform" type="translate" values="474 406;474 380;474 406" dur="4.3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(760 404)">
      <text y="0" font-size="28">📊</text><text y="30" fill="#FEF3C7" font-size="12" font-weight="800">BI</text>
      <animateTransform attributeName="transform" type="translate" values="760 404;760 378;760 404" dur="4.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="32" y="28" width="1136" height="504" rx="30" stroke="#FFFFFF" stroke-opacity="0.14"/>
</svg>
